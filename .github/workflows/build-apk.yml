name: Arqami Android Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arqami-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Analyze, Test and Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install Blender for original 3D asset production
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender
          blender --version

      - name: Generate original Blender-rendered game assets
        run: blender --background --python tool/generate_blender_assets.py

      - name: Validate Blender asset outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/game/backgrounds/world_map.png
          test -s assets/game/characters/companion.png
          test -s assets/game/ui/level_node.png
          test -s assets/game/ui/level_node_completed.png
          test -s assets/game/ui/level_node_locked.png
          test -s assets/game/rewards/reward_badge.png
          test -s assets/game/rewards/stars.png
          test -s assets/game/effects/success.png
          test -s assets/game/effects/unlock.png
          find assets/game -maxdepth 3 -type f -name '*.png' -printf '%p %s bytes\\n' | sort

      - name: Upload Blender visual review assets
        uses: actions/upload-artifact@v4
        with:
          name: arqami-blender-assets-preview
          path: |
            assets/game/backgrounds/world_map.png
            assets/game/characters/companion.png
            assets/game/ui/level_node.png
            assets/game/ui/level_node_completed.png
            assets/game/ui/level_node_locked.png
            assets/game/rewards/reward_badge.png
            assets/game/rewards/stars.png
            assets/game/effects/success.png
            assets/game/effects/unlock.png
          if-no-files-found: error
          retention-days: 14

      - name: Prepare selected CC0 game assets
        shell: bash
        run: bash tool/prepare_game_assets.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # These are release-mode build candidates. Final Play artifacts must use
      # the protected production upload key before publishing.
      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/arqami-release.apk
          cp build/app/outputs/bundle/release/app-release.aab build/release/arqami-release.aab

      - name: Upload Android release candidates
        uses: actions/upload-artifact@v4
        with:
          name: arqami-android-release-candidates
          path: build/release/*
          if-no-files-found: error
          retention-days: 30
