name: Arqami Android Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arqami-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Analyze, Test and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # CI uses the existing debug signing configuration until a protected
      # Play upload key is configured. This APK is a build candidate,
      # not yet the final Play-signed release artifact.
      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/arqami-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: arqami-android-release-candidate
          path: build/release/arqami-release.apk
          if-no-files-found: error
          retention-days: 30
