name: Arqami Android Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arqami-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Analyze, Test and Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Split final curriculum stages
        if: github.sha == 'c948caf11fcc2ad4d10159fbffbe5e3ece12f14e'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path('lib/models/units_data.dart')
          text = path.read_text(encoding='utf-8')
          replacement = r'''    // المرحلة 7 — الكسور | 10–13 سنة
              _unit(n: 45, title: 'مفهوم الكسر والجزء من الكل', age: '10–13 سنة', description: 'فهم الكسر بوصفه جزءاً من كل متساوي الأجزاء، والتعرف على البسط والمقام.', learnTitle: 'ما هو الكسر؟', explanation: 'الكسر يصف جزءاً من كل مقسم إلى أجزاء متساوية. البسط يحدد عدد الأجزاء المأخوذة والمقام يحدد عدد الأجزاء الكلية.', examples: ['1/2 نصف', '3/4 ثلاثة أرباع'], quiz: [_q('في 3/4 ما البسط؟', ['3', '4', '7'], 0), _q('في 3/4 ما المقام؟', ['3', '4', '1'], 1)]),
              _unit(n: 46, title: 'الكسور المتكافئة والمقارنة والعمليات', age: '10–13 سنة', description: 'مقارنة الكسور والتعرف على الكسور المتكافئة ثم إجراء عمليات بسيطة عليها.', learnTitle: 'نقارن ونحسب بالكسور', explanation: 'الكسور المتكافئة تمثل الكمية نفسها، ويمكن مقارنة الكسور ثم جمعها وطرحها في الحالات المناسبة.', examples: ['1/2 = 2/4', '1/4 < 3/4', '1/4 + 1/4 = 1/2'], quiz: [_q('أي كسر يكافئ 1/2؟', ['1/3', '2/4', '3/4'], 1), _q('1/4 + 1/4 = ؟', ['1/2', '1/4', '3/4'], 0)]),

              // المرحلة 8 — الأعداد العشرية | 10–13 سنة
              _unit(n: 47, title: 'الأعداد العشرية والقيمة المكانية', age: '10–13 سنة', description: 'فهم الأعشار والأجزاء من مئة وقراءة الأعداد العشرية وربطها بالكسور.', learnTitle: 'ما بعد الفاصلة', explanation: 'الأرقام بعد الفاصلة تمثل أجزاء من الواحد، مثل الأعشار والأجزاء من مئة.', examples: ['0.5 = 5/10', '1.25 = 1 + 25/100'], quiz: [_q('0.5 يساوي أي كسر؟', ['1/2', '1/5', '5/100'], 0), _q('ما قيمة 5 في 1.25؟', ['5 أعشار', '5 أجزاء من مئة', '5 آحاد'], 1)]),
              _unit(n: 48, title: 'العمليات على الأعداد العشرية', age: '10–13 سنة', description: 'الجمع والطرح والضرب والقسمة على الأعداد العشرية مع مسائل تطبيقية.', learnTitle: 'نحسب بالعشريات', explanation: 'نرتب الفاصلة عند الجمع والطرح، ونفهم موضع الفاصلة عند الضرب والقسمة.', examples: ['1.2 + 0.3 = 1.5', '2.5 − 0.5 = 2', '1.9 + 1.9 = 3.8'], quiz: [_q('1.2 + 0.3 = ؟', ['1.3', '1.5', '1.7'], 1), _q('1.9 + 1.9 = ؟', ['3.6', '3.8', '4.0'], 1)]),

              // المرحلة 9 — النسبة والتناسب والنسبة المئوية | 12–15 سنة
              _unit(n: 49, title: 'النسبة ومعدل الوحدة', age: '12–15 سنة', description: 'فهم النسبة ومقارنة كميتين واستخدام معدل الوحدة في مواقف واقعية.', learnTitle: 'نقارن كميتين بالنسبة', explanation: 'النسبة تقارن بين كميتين، ومعدل الوحدة يبين كمية واحدة مقابل وحدة واحدة.', examples: ['2:3 نسبة', '12 تفاحة إلى 4 أطفال = 3 تفاحات لكل طفل'], quiz: [_q('2:3 تمثل؟', ['نسبة', 'معادلة', 'كسر عشري فقط'], 0), _q('12 تفاحة لـ4 أطفال، كم لكل طفل؟', ['2', '3', '4'], 1)]),
              _unit(n: 50, title: 'التناسب والنسبة المئوية', age: '12–15 سنة', description: 'حل التناسبات البسيطة وفهم النسبة المئوية وربطها بالكسور والأعداد العشرية.', learnTitle: 'نحل التناسب ونفهم النسبة المئوية', explanation: 'التناسب يعني تساوي نسبتين، والنسبة المئوية جزء من 100 ويمكن تحويلها إلى كسر أو عدد عشري.', examples: ['2/3 = 4/6', '50% = 1/2 = 0.5', '25% = 1/4'], quiz: [_q('50% يساوي؟', ['1/2', '1/4', '2/5'], 0), _q('إذا كان 2/3 = x/6 فما x؟', ['2', '4', '6'], 1)]),

              // المرحلة 10 — الجبر والمعادلات والمتباينات | 13–16 سنة
              _unit(n: 51, title: 'المتغيرات والتعبيرات الجبرية', age: '13–16 سنة', description: 'التعرف على المتغيرات والثوابت والمعاملات وكتابة وتبسيط التعبيرات الجبرية.', learnTitle: 'ننتقل إلى الرموز', explanation: 'المتغير يمثل قيمة يمكن أن تتغير، والتعبير الجبري يجمع الأعداد والرموز والعمليات لتمثيل علاقة رياضية.', examples: ['x + 3', '2x + 5', '3x + 2x = 5x'], quiz: [_q('في 2x + 5 ما المتغير؟', ['2', 'x', '5'], 1), _q('3x + 2x = ؟', ['5x', '6x', 'x'], 0)]),
              _unit(n: 52, title: 'المعادلات والمتباينات والمسائل الجبرية', age: '13–16 سنة', description: 'حل المعادلات والمتباينات والتحقق من الحل وتحويل المسائل اللفظية إلى علاقات جبرية.', learnTitle: 'نحل ونحقق', explanation: 'نستخدم العمليات العكسية لعزل المتغير، ثم نتحقق من الحل. وفي المتباينات نحدد القيم التي تحقق العلاقة.', examples: ['x + 3 = 7', '2x = 10', 'x > 4', 'إذا كان x + 5 = 12 فإن x = 7'], quiz: [_q('إذا كان x + 3 = 7 فما قيمة x؟', ['3', '4', '5'], 1), _q('x > 4، أي قيمة تحقق المتباينة؟', ['3', '4', '6'], 2)], assessment: [_q('2x = 10، x = ؟', ['4', '5', '6'], 1), _q('x + 5 = 12، x = ؟', ['5', '7', '8'], 1), _q('x > 4، أي قيمة صحيحة؟', ['2', '4', '6'], 2)]),
'''
          pattern = re.compile(r"    // المرحلة 7 — الكسور.*?    _unit\(n: 52,.*?\),\n  \];", re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('Could not locate final curriculum block')
          text = text[:match.start()] + replacement + '  ];' + text[match.end():]
          path.write_text(text, encoding='utf-8')

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'lib/models/units_data.dart'], check=True)
          subprocess.run(['git', 'commit', '-m', 'curriculum: split ratios and algebra stages [skip ci]'], check=True)
          subprocess.run(['git', 'push'], check=True)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # These are release-mode build candidates. Final Play artifacts must use
      # the protected production upload key before publishing.
      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/arqami-release.apk
          cp build/app/outputs/bundle/release/app-release.aab build/release/arqami-release.aab

      - name: Upload Android release candidates
        uses: actions/upload-artifact@v4
        with:
          name: arqami-android-release-candidates
          path: build/release/*
          if-no-files-found: error
          retention-days: 30
