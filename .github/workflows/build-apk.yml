name: Arqami APK Build

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arqami-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Arqami Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # Analyze (لا يمنع بناء الـ APK إذا كانت هناك تحذيرات)
      - name: Analyze project
        continue-on-error: true
        run: flutter analyze

      # Tests (اختياري)
      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/arqami-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arqami-release-apk
          path: build/release/arqami-release.apk
          if-no-files-found: error
          retention-days: 30
