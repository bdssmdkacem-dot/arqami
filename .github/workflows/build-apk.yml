name: Arqami APK Build

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arqami-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Arqami Release APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      # --------------------------------------------------
      # Environment information
      # --------------------------------------------------
      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Version
        run: flutter --version

      # --------------------------------------------------
      # Dependencies
      # --------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------
      # Analyze
      # --------------------------------------------------
      - name: Analyze project
        run: flutter analyze

      # --------------------------------------------------
      # Tests
      # --------------------------------------------------
      - name: Run tests
        run: flutter test

      # --------------------------------------------------
      # Build Release APK
      # --------------------------------------------------
      - name: Build Release APK
        run: flutter build apk --release

      # --------------------------------------------------
      # Rename APK
      # --------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/release/arqami-release.apk

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arqami-release-apk
          path: build/release/arqami-release.apk
          if-no-files-found: error
          retention-days: 30
