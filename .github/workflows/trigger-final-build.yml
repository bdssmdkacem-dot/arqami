name: One-time Final Build Trigger

on:
  push:
    paths:
      - '.github/workflows/trigger-final-build.yml'

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Android build for repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 'Arqami Android Build' --ref main

# one-time trigger update
