name: arqami
description: "أرقامي — تطبيق تعليمي لتعلم الأرقام للأطفال الناطقين بالعربية (4-6 سنوات)"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # واجهة Material 3
  cupertino_icons: ^1.0.8

  # التتبع بالإصبع (TraceWidget)
  signature: ^5.5.0

  # حفظ التقدم محلياً
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # نطق الأرقام والعبارات بالعربية عبر Text-to-Speech
  flutter_tts: ^4.2.0

  # AdMob
  google_mobile_ads: ^5.2.0

  # مشاركة شهادة الإنجاز
  share_plus: ^12.0.1

  # مسارات الملفات المؤقتة
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # لا توجد assets خارجية حالياً.
  #
  # إذا أضفت لاحقاً خط Cairo:
  #
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
